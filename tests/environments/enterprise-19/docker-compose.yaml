services:
  olr:
    image: ${OLR_IMAGE:-olr-dev:latest}
    user: "${OLR_UID:-1000}:${OLR_GID:-1000}"
    entrypoint: []
    command: ["sleep", "infinity"]
    volumes:
      - ../../..:/opt/OpenLogReplicator-local

  oracle:
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    container_name: oracle
    ports:
      - "1521:1521"
    env_file: .env
    environment:
      ORACLE_PWD: oracle
      ORACLE_SID: ORCLCDB
      ENABLE_ARCHIVELOG: "true"
    volumes:
      - ./oracle-init:/opt/oracle/scripts/startup
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 42 FROM dual;' | sqlplus -S olr_test/olr_test@//localhost:1521/ORCLPDB1 | grep -q 42"]
      interval: 30s
      timeout: 30s
      retries: 60
      start_period: 900s

volumes:
  oradata:
