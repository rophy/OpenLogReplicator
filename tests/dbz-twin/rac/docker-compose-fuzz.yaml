services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: fuzz-kafka
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  dbz-logminer:
    image: rophy/debezium-server:3.5.0-2a7978c0af
    container_name: fuzz-dbz-logminer
    network_mode: host
    environment:
      VM_HOST: ${VM_HOST:?VM_HOST is required}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/application-logminer-kafka.properties:/debezium/config/application.properties:ro
      - ../lib/ojdbc8.jar:/debezium/lib/ojdbc8.jar:ro
      - dbz-logminer-data:/debezium/data

  dbz-olr:
    image: rophy/debezium-server:3.5.0-2a7978c0af
    container_name: fuzz-dbz-olr
    network_mode: host
    environment:
      VM_HOST: ${VM_HOST:?VM_HOST is required}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/application-olr-kafka.properties:/debezium/config/application.properties:ro
      - ../lib/ojdbc8.jar:/debezium/lib/ojdbc8.jar:ro
      - dbz-olr-data:/debezium/data

  dbz-lob-logminer:
    image: rophy/debezium-server:3.5.0-2a7978c0af
    container_name: fuzz-dbz-lob-logminer
    network_mode: host
    environment:
      VM_HOST: ${VM_HOST:?VM_HOST is required}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/application-lob-logminer-kafka.properties:/debezium/config/application.properties:ro
      - ../lib/ojdbc8.jar:/debezium/lib/ojdbc8.jar:ro
      - dbz-lob-logminer-data:/debezium/data

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    image: fuzz-consumer:latest
    container_name: fuzz-consumer
    network_mode: host
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python3", "/app/kafka-consumer.py"]
    environment:
      KAFKA_BOOTSTRAP: localhost:9092
      SQLITE_DB: /app/data/fuzz.db
      LM_TOPIC: lm-events
      OLR_TOPIC: olr-events
      OLR_LOB_TOPIC: olr-lob-events
      PURGE_TTL_HOURS: "${PURGE_TTL_HOURS:-24}"
    volumes:
      - ./kafka-consumer.py:/app/kafka-consumer.py:ro
      - fuzz-data:/app/data

  validator:
    build:
      context: .
      dockerfile: Dockerfile
    image: fuzz-consumer:latest
    container_name: fuzz-validator
    network_mode: host
    profiles: ["validate"]
    depends_on:
      consumer:
        condition: service_started
    command: ["python3", "/app/validator.py"]
    environment:
      SQLITE_DB: /app/data/fuzz.db
      POLL_INTERVAL: "10"
      IDLE_TIMEOUT: "120"
    volumes:
      - ./validator.py:/app/validator.py:ro
      - fuzz-data:/app/data

  archive-cleanup:
    build:
      context: ./archive-cleanup
    image: fuzz-archive-cleanup:latest
    container_name: fuzz-archive-cleanup
    environment:
      VM_HOST: ${VM_HOST:?VM_HOST is required}
      VM_USER: ${VM_USER:-root}
    volumes:
      - ${VM_KEY:?VM_KEY is required}:/vm-key:ro
      - ./archive-cleanup/crontab:/etc/crontab:ro

volumes:
  dbz-logminer-data:
  dbz-olr-data:
  dbz-lob-logminer-data:
  fuzz-data:
